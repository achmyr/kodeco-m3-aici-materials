name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Claude Code review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow GITHUB_TOKEN so we do not require the Claude Code
          # GitHub App (OIDC app-token exchange). Comments are posted below
          # via github-script with the same token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.base_ref }}

            Goal: produce a concise PR review as your final message (posted as a PR comment).

            1. Run once: `git diff origin/${{ github.base_ref }}...HEAD`
            2. Read CODE_REVIEW.md only if needed for priorities.
            3. Open individual files only when the diff is insufficient to judge an issue.
            4. Prioritise: correctness, concurrency safety, retain cycles, SwiftUI state ownership.
            5. List only concrete issues with file:line references. Skip pure style nits.
            6. If there are no high-severity issues, say so briefly and stop.

            Do not explore the whole repo. Finish with the full markdown review — no extra tool calls after that.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(git *)"
      - name: Print token usage
        if: always() && steps.claude.outputs.execution_file != ''
        run: ./scripts/claude-token-usage.sh "${{ steps.claude.outputs.execution_file }}"
      - name: Extract review text
        if: success() && steps.claude.outputs.execution_file != ''
        run: |
          jq -r '
            [.[] | select(.type == "result" and .subtype == "success")]
            | last
            | .result // empty
          ' "${{ steps.claude.outputs.execution_file }}" > claude-review.md
          if [ ! -s claude-review.md ]; then
            echo "No review text found in Claude execution result." >&2
          fi
      - name: Post review comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('claude-review.md')) {
              core.info('claude-review.md missing – skipping comment');
              return;
            }
            const body = fs.readFileSync('claude-review.md', 'utf8').trim();
            if (body && body.length > 100) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## Claude Code Review\n\n' + body
              });
            } else {
              core.info('Review text too short – skipping comment');
            }
