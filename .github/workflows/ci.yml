name: Token Dashboard CI
on:
  workflow_dispatch: ~
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    if: false
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run xcodebuild
        shell: bash
        run: |
          cd TokensDashboard
          xcodebuild -project TokensDashboard.xcodeproj -scheme TokensDashboard -destination 'platform=iOS Simulator,name=iPhone 17' test


