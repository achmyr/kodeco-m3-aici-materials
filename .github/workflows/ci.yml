name: Token Dashboard CI
on:
  workflow_dispatch: ~
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    if: github.event_name == 'pull_request'
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
      - name: Run xcodebuild
        shell: bash
        run: |
          xcodebuild -project TokenDashboard.xcodeproj -scheme TokenDashboard -destination 'platform=iOS Simulator,name=iPhone 14,OS=17.0' test
          
          

